<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sabaq Blocker</title>
<style>
  :root{color-scheme:light dark;--bg:#F4F1EA;--card:#FFFDF8;--ink:#1D2433;--muted:#5D6575;--pen:#2F4FA8;--rule:#DDD6C8}
  @media (prefers-color-scheme:dark){:root{--bg:#050C19;--card:#111A2B;--ink:#E8ECF4;--muted:#A3ADC2;--pen:#93A9FF;--rule:#2A3550}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Tahoma,sans-serif;padding:16px}
  body.popup{min-height:0;width:320px}
  main{max-width:460px;width:100%;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:28px 24px;text-align:center;display:grid;gap:12px}
  img{width:64px;height:64px;margin:0 auto;border-radius:14px}
  h1{margin:0;font-size:1.5rem}
  p{margin:0;color:var(--muted)}
  .left{font-size:2rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;direction:ltr}
  a{display:inline-block;margin-top:6px;background:var(--pen);color:var(--card);text-decoration:none;font-weight:700;border-radius:10px;padding:10px 18px}
</style>
<main>
  <img src="icon-128.png" alt="">
  <h1 id="title"></h1>
  <p id="msg"></p>
  <div class="left" id="left" hidden></div>
  <a id="back" href="https://sabaq-study.pages.dev/" target="_blank" rel="noopener"></a>
</main>
<script src="blocked.js"></script>
