<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Homework, a daily schedule with goals, reminders and a focus timer, in many languages.">
<meta name="theme-color" content="#050C19">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Sabaq">
<title>Sabaq Study Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Nastaliq+Urdu:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Young+Serif&display=swap">
<style>
/* Layout: a study desk with two sheets side by side — the assignment form, and a dotted answer page with a red exercise-book margin rule. Stacks to one column on phones; mirrors for Arabic and Urdu. */
:root{
  --desk:#E8ECF3; --sheet:#FFFFFF; --paper:#FCFDFF; --ink:#18202E; --muted:#596377;
  --rule:#D3DAE6; --dot:#CBD3E2; --pen:#2546C4; --pen-soft:#E3E8FB; --on-pen:#FFFFFF;
  --margin:#D6455A; --hi:#FFE47A; --warn:#A4361F; --ok:#1D7A4B; --ok-soft:#E1F3E9;
  --font-display:"Young Serif","Noto Naskh Arabic","Noto Sans Devanagari","Noto Sans Bengali",Georgia,serif;
  --font-body:"Atkinson Hyperlegible","Noto Naskh Arabic","Noto Sans Devanagari","Noto Sans Bengali","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --font-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#0F131B; --sheet:#171C27; --paper:#1A202D; --ink:#E5E9F1; --muted:#9BA4B6;
    --rule:#2B3344; --dot:#2E3749; --pen:#93A8FF; --pen-soft:#25304D; --on-pen:#0D1430;
    --margin:#FF7B8D; --hi:#5E5016; --warn:#FF9C84; --ok:#71D59F; --ok-soft:#173627; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#0F131B; --sheet:#171C27; --paper:#1A202D; --ink:#E5E9F1; --muted:#9BA4B6;
  --rule:#2B3344; --dot:#2E3749; --pen:#93A8FF; --pen-soft:#25304D; --on-pen:#0D1430;
  --margin:#FF7B8D; --hi:#5E5016; --warn:#FF9C84; --ok:#71D59F; --ok-soft:#173627; color-scheme:dark;
}
[lang="ur"]{--font-body:"Noto Nastaliq Urdu","Noto Naskh Arabic",system-ui,sans-serif;--font-display:var(--font-body);line-height:2.15}

*,*::before,*::after{box-sizing:border-box}
body{
  background:var(--desk);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 48px;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.desk{max-width:1180px;margin:0 auto;display:grid;gap:20px}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px}
.brand{display:grid;gap:2px;min-width:0}
.brand-row{display:flex;align-items:center;gap:14px 18px;min-width:0}
.logo{width:92px;height:92px;flex:none;border-radius:22%;box-shadow:0 2px 10px rgb(0 0 0 / .18)}
@media (max-width:520px){.logo{width:68px;height:68px}}
.wordmark{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:2.4rem;line-height:1;margin:0;letter-spacing:-.01em}
.wordmark span{color:var(--margin)}
.lesson{margin:0;font-family:var(--font-hand);font-size:1.25rem;color:var(--muted);line-height:1.2}
.tagline{margin:4px 0 0;color:var(--muted)}
.langs{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding-block:4px;scrollbar-width:thin}
.lang{
  flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;
  padding:6px 13px;cursor:pointer;font-size:.95rem;line-height:1.4;white-space:nowrap;
}
.lang:hover{border-color:var(--pen)}
.lang[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.lang[lang="ur"]{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;line-height:1.6;padding-block:2px}

/* Sheets */
.grid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:20px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);min-width:0}
.sheet h2{font-family:var(--font-display);font-weight:400;font-size:1.45rem;margin:0;line-height:1.3;text-wrap:balance}

.form{padding:22px clamp(16px,3vw,28px);display:grid;gap:18px}
#askForm{display:grid;gap:18px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend,.field>span{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;padding:0}
[lang="ur"] legend,[lang="ur"] .field>span,[lang="ar"] legend,[lang="ar"] .field>span{letter-spacing:0;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{
  display:inline-block;border:1px solid var(--rule);border-radius:8px;padding:6px 12px;
  background:var(--paper);font-size:.95rem;line-height:1.45;cursor:pointer;
}
.chip input:checked+span{border-color:var(--pen);background:var(--pen-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--pen)}
.chip input:focus-visible+span{outline:2px solid var(--pen);outline-offset:2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.field{display:grid;gap:0;min-width:0}
select,textarea{
  width:100%;border:1px solid var(--rule);border-radius:8px;background:var(--paper);padding:10px 12px;
}
select{cursor:pointer}
textarea{resize:vertical;min-height:150px;line-height:1.55}
textarea::placeholder{color:var(--muted);opacity:.8}

.photo{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.photo-btn{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--pen);font-weight:700;
  border:1px dashed var(--pen);border-radius:8px;padding:8px 14px;
}
.photo-btn svg{width:20px;height:20px;flex:none}
#photo:focus-visible+.photo-btn,.photo-btn:focus-within{outline:2px solid var(--pen);outline-offset:2px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumbs figure{position:relative;margin:0}
.thumbs img{display:block;width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--rule);background:var(--paper)}
.thumbs button{position:absolute;top:-7px;inset-inline-end:-7px;width:22px;height:22px;padding:0;display:grid;place-items:center;border-radius:50%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer}
.thumbs button:hover{color:var(--margin);border-color:var(--margin)}
.thumbs button svg{width:12px;height:12px}
.photo-hint{margin:-4px 0 0;color:var(--muted);font-size:.85rem}
#askForm.dropping{outline:2px dashed var(--pen);outline-offset:6px;border-radius:8px}
.q-imgs{display:flex;flex-wrap:wrap;gap:6px}
.q .q-imgs img{max-height:96px}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.primary{
  background:var(--pen);color:var(--on-pen);border:0;border-radius:10px;padding:12px 22px;font-weight:700;cursor:pointer;
}
.primary:disabled{opacity:.55;cursor:default}
.ghost{background:transparent;border:1px solid var(--rule);border-radius:10px;padding:10px 16px;cursor:pointer}
.ghost:hover{border-color:var(--pen)}
.status{margin:0;min-height:1.2em;color:var(--warn);font-size:.95rem}
.footnote{margin:0;padding-top:14px;border-top:1px solid var(--rule);color:var(--muted);font-size:.88rem}

/* Answer page */
.answer{overflow:hidden;display:grid}
.answer-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:16px clamp(16px,3vw,24px);border-bottom:1px solid var(--rule)}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tool{background:transparent;border:1px solid var(--rule);border-radius:8px;padding:5px 11px;font-size:.88rem;cursor:pointer}
.tool:hover{border-color:var(--pen);color:var(--pen)}
.page{
  position:relative;min-height:420px;padding-block:22px 28px;
  padding-inline:64px clamp(16px,3vw,32px);
  background-color:var(--paper);
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);
  background-size:22px 22px;
  display:grid;gap:18px;align-content:start;
}
.page::before{content:"";position:absolute;inset-block:0;inset-inline-start:44px;width:2px;background:var(--margin);opacity:.65}
@media (max-width:520px){.page{padding-inline-start:40px}.page::before{inset-inline-start:24px}}
.tag{font-family:var(--font-hand);color:var(--margin);font-size:1.5rem;line-height:1;justify-self:start;margin:0}
.tag-word{display:inline-block;transform:rotate(-3deg)}
.tag small{display:block;font-family:var(--font-body);font-size:.85rem;color:var(--muted);transform:none;line-height:1.5;margin-top:6px}
.q{min-width:0}
.q .who{font-family:var(--font-hand);color:var(--muted);font-size:1.2rem;line-height:1}
.q p{margin:2px 0 0;font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere}
.q img{margin-top:8px;max-height:140px;width:auto;border-radius:6px;border:1px solid var(--rule)}
.a{min-width:0;overflow-wrap:break-word;padding-bottom:6px;border-bottom:1px dashed var(--rule)}
/* English translation shown under an answer */
.en-wrap{display:grid;gap:6px;margin-top:-4px;padding:12px 14px;border-radius:10px;background:var(--paper);border-inline-start:3px solid var(--pen)}
.en-label{margin:0;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pen)}
[lang="ar"] .en-label,[lang="ur"] .en-label{letter-spacing:0;font-size:.88rem}
.en-wrap .a{border-bottom:0;padding-bottom:0}
.en-wrap .thinking{padding:0}
.check{display:flex;align-items:center;gap:8px;font-size:.95rem;cursor:pointer;width:fit-content}
.check[hidden]{display:none}
.check input{width:18px;height:18px;margin:0;accent-color:var(--pen);flex:none;cursor:pointer}
.a:last-child{border-bottom:0}
.a>:first-child{margin-top:0}
.a p,.a ul,.a ol{margin:0 0 .75em}
.a ul,.a ol{padding-inline-start:1.4em}
.a li{margin-bottom:.3em}
.a h1,.a h2,.a h3,.a h4{font-family:var(--font-display);font-weight:400;line-height:1.3;margin:1em 0 .4em;font-size:1.2rem}
.a strong{font-weight:700;background:linear-gradient(transparent 58%,var(--hi) 58%);padding-inline:1px}
.a code{font-family:var(--font-mono);font-size:.88em;background:var(--pen-soft);padding:.08em .38em;border-radius:4px;direction:ltr;unicode-bidi:isolate}
.a pre{direction:ltr;text-align:left;overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;margin:0 0 .75em}
.a pre code{background:none;padding:0}
.a table{display:block;overflow-x:auto;border-collapse:collapse;margin:0 0 .75em}
.a th,.a td{border:1px solid var(--rule);padding:6px 10px;text-align:start}
.a blockquote{margin:0 0 .75em;padding-inline-start:12px;border-inline-start:3px solid var(--rule);color:var(--muted)}
.a .ayah{font-family:"Noto Naskh Arabic",serif;font-size:1.2em;line-height:2;color:var(--ink);unicode-bidi:isolate}
.a blockquote:has(.ayah){border-inline-start-color:var(--ok);background:var(--paper);border-radius:0 8px 8px 0;padding:8px 12px}.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-style:italic}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--pen);animation:blink 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}

.follow{display:flex;flex-wrap:wrap;gap:8px;padding:14px clamp(16px,3vw,24px);border-top:1px solid var(--rule);background:var(--sheet)}
.follow input{flex:1 1 220px;min-width:0;border:1px solid var(--rule);border-radius:8px;background:var(--paper);padding:9px 12px}
.follow .primary{padding:9px 18px}

/* Homework list */
.hw{padding:18px clamp(16px,3vw,28px);display:grid;gap:12px}
.hw-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem}
.hw-head-r{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.rep-tag{border-radius:999px;padding:0 9px;font-size:.8rem;font-weight:700;white-space:nowrap;color:var(--margin);border:1px dashed var(--margin)}
.hw-item.flash{animation:hwflash 1.6s ease-out}
@keyframes hwflash{0%,40%{background:var(--hi)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.hw-item.flash{animation:none;outline:2px solid var(--hi)}}
.hw-list{list-style:none;margin:0;padding:0;display:grid}
.hw-list:empty{display:none}
.hw-item{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;grid-template-areas:"chk name due help del";
  align-items:center;gap:6px 12px;padding:10px 0;border-top:1px solid var(--rule);
}
.hw-item:first-child{border-top:0}
.hw-chk{grid-area:chk;width:20px;height:20px;accent-color:var(--pen);margin:0;cursor:pointer}
.hw-name{grid-area:name;min-width:0;overflow-wrap:anywhere;font-weight:700;cursor:pointer}
.hw-item.done .hw-name{text-decoration:line-through;text-decoration-color:var(--margin);text-decoration-thickness:2px;color:var(--muted);font-weight:400}
.due{grid-area:due;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem}
.pill{border-radius:999px;padding:0 9px;font-size:.8rem;font-weight:700;border:1px solid var(--rule);white-space:nowrap}
.pill.over{color:var(--margin);border-color:var(--margin)}
.pill.soon{background:var(--hi);border-color:transparent;color:var(--ink)}
.hw-item.done .pill{display:none}
.hw-help{grid-area:help;justify-self:end}
.icon-btn{grid-area:del;background:transparent;border:0;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;line-height:0}
.icon-btn:hover{color:var(--margin)}
.icon-btn svg{width:18px;height:18px}
@media (max-width:640px){
  .hw-item{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"chk name del" ". due help"}
}
.hw-empty{margin:0;color:var(--muted);padding:12px 14px;border:1px dashed var(--rule);border-radius:8px;background:var(--paper)}
.hw-add{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.hw-add .field{flex:1 1 240px}
.hw-add .hw-date-field{flex:0 1 190px}
.hw-add input{width:100%;border:1px solid var(--rule);border-radius:8px;background:var(--paper);padding:10px 12px}
.hw-add .primary{padding:11px 22px}
.hw-note{margin:0;color:var(--muted);font-size:.85rem}
.hw-note.warn{color:var(--warn)}
.hw-hint{margin:0;color:var(--muted);font-size:.85rem}
.add-box{display:grid;gap:12px;padding:16px clamp(14px,2.5vw,20px);border:1px dashed var(--pen);border-radius:10px;background:var(--paper)}
.add-title{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.15rem;line-height:1.35;text-wrap:balance}
.hw-add .hw-rem-field{flex:0 1 190px}
.remind-sel{width:auto;max-width:100%;border:1px solid var(--rule);border-radius:6px;background:var(--paper);padding:2px 6px;font-size:.85rem}
.hw-item.done .remind-sel{display:none}

/* Schedule: a 7-day strip, then one tear-off calendar page per day with something due */
.sched{padding:18px clamp(16px,3vw,28px);display:grid;gap:14px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{border:1px solid var(--rule);border-radius:8px;padding:6px 2px;text-align:center;display:grid;gap:2px;background:var(--paper);min-width:0}
.wd.today{border-color:var(--pen);box-shadow:inset 0 0 0 1px var(--pen)}
.wd-name{font-size:.74rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wd-num{font-family:var(--font-display);font-size:1.25rem;line-height:1.2;font-variant-numeric:tabular-nums}
.wd-count{justify-self:center;min-width:1.7em;padding-inline:4px;border-radius:999px;font-size:.78rem;font-weight:700;line-height:1.6;color:var(--muted);font-variant-numeric:tabular-nums}
.wd.has .wd-count{background:var(--pen);color:var(--on-pen)}
.agenda{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.agenda:empty{display:none}
.day{display:grid;grid-template-columns:68px minmax(0,1fr);gap:14px;align-items:start}
.cal{border:1px solid var(--rule);border-radius:8px;overflow:hidden;text-align:center;background:var(--paper)}
.cal-m{color:var(--margin);border-bottom:2px solid var(--margin);font-size:.74rem;font-weight:700;line-height:1.6;min-height:1.6em;overflow:hidden;white-space:nowrap}
.cal-d{font-family:var(--font-display);font-size:1.7rem;line-height:1.25;font-variant-numeric:tabular-nums}
.cal-w{font-size:.74rem;color:var(--muted);padding-bottom:4px;min-height:1.4em;overflow:hidden;white-space:nowrap}
.cal.over .cal-d{color:var(--margin)}
.day-body{min-width:0;display:grid;gap:6px;padding-top:2px}
.day-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:700}
.day.over .day-head{color:var(--margin)}
.day-items{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.day-items li{display:flex;align-items:center;gap:10px;min-width:0}
.day-items input{width:18px;height:18px;flex:none;accent-color:var(--pen);margin:0;cursor:pointer}
.day-items label{min-width:0;overflow-wrap:anywhere;cursor:pointer}
.day-items li.done label{text-decoration:line-through;text-decoration-color:var(--margin);text-decoration-thickness:2px;color:var(--muted)}
.day-items .when{color:var(--muted);font-size:.85rem;white-space:nowrap}
.goal-tag{flex:none;font-size:.72rem;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:1px 8px;white-space:nowrap}
.day-items .icon-btn{margin-inline-start:auto;flex:none}

/* Tap a day to see it and set goals for it */
button.wd{font:inherit;color:inherit;cursor:pointer}
button.wd:hover{border-color:var(--pen)}
.wd.sel{background:var(--pen-soft);border-color:var(--pen)}
.day-panel{display:grid;gap:12px;padding:16px clamp(14px,2.5vw,20px);border:1px solid var(--pen);border-radius:10px;background:var(--paper)}
.dp-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px}
.dp-head h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.3rem}
.dp-pick{flex:0 1 200px}
.day-panel h4{margin:4px 0 0;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
[lang="ur"] .day-panel h4,[lang="ar"] .day-panel h4{letter-spacing:0;font-size:.9rem}
.day-panel .day-items:empty{display:none}
.dp-empty{margin:0;color:var(--muted);font-size:.92rem}
.dp-hw{justify-self:start}

/* Jump links under the header */
.jump{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.95rem}
.jump a{color:var(--pen);text-decoration:none;font-weight:700;padding-block:2px;border-bottom:2px solid transparent}
.jump a:hover{border-bottom-color:var(--pen)}
.jump .install-link{margin-inline-start:auto;border:1px solid var(--pen);border-radius:999px;padding:1px 12px}

/* Study plan steps under an assignment */
.hw-acts{grid-area:help;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.hw-item.has-steps{grid-template-areas:"chk name due help del" ". steps steps steps steps"}
@media (max-width:640px){.hw-item.has-steps{grid-template-areas:"chk name del" ". due help" ". steps steps"}}
.hw-steps{grid-area:steps;list-style:none;margin:2px 0 0;padding:8px 0 0;border-top:1px dashed var(--rule);display:grid;gap:5px;font-size:.92rem;min-width:0}
.hw-steps li{display:flex;align-items:center;gap:8px;min-width:0}
.hw-steps input{width:16px;height:16px;accent-color:var(--pen);margin:0;flex:none;cursor:pointer}
.hw-steps label{min-width:0;overflow-wrap:anywhere;cursor:pointer}
.hw-steps li.done label{text-decoration:line-through;color:var(--muted)}
.hw-steps time{color:var(--muted);font-size:.82rem;white-space:nowrap;margin-inline-start:auto}
.mins{color:var(--muted);font-size:.85rem;white-space:nowrap}
.day-items li:not(.step) label{font-weight:700}
.day-items .of{color:var(--muted);font-size:.85rem;font-weight:400}
.day-items .of::before{content:"· "}

/* Study tools */
.tools{padding:18px clamp(16px,3vw,28px);display:grid;gap:14px}
.tools-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.tools-intro{margin:0;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.tabs button{border:0;background:transparent;border-radius:7px;padding:6px 14px;cursor:pointer;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--pen);color:var(--on-pen)}
.topic-row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.topic-row .field{flex:1 1 320px}
.topic-row textarea{min-height:64px}
.tools code{font-family:var(--font-mono);font-size:.9em;background:var(--pen-soft);padding:.05em .35em;border-radius:4px;direction:ltr;unicode-bidi:isolate}
.pane{display:grid;gap:12px;justify-items:center}
.pane .tag{justify-self:center}

/* Flashcards: ruled index cards with the red header line */
.fcard{position:relative;width:min(100%,540px);min-height:230px;aspect-ratio:5/3;max-width:100%;perspective:1400px;cursor:pointer;border-radius:10px}
.fc-inner{position:absolute;inset:0;transition:transform .55s cubic-bezier(.3,.7,.25,1);transform-style:preserve-3d}
.fcard.flipped .fc-inner{transform:rotateY(180deg)}
.fcard.instant .fc-inner{transition:none}
.fc-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--rule);border-radius:10px;
  background-color:var(--sheet);
  background-image:linear-gradient(to bottom,transparent 46px,var(--margin) 46px,var(--margin) 48px,transparent 48px),
    repeating-linear-gradient(to bottom,transparent 0,transparent 27px,var(--dot) 27px,var(--dot) 28px);
  background-position:0 0,0 48px;background-repeat:no-repeat,repeat;
  display:grid;place-items:center;padding:60px 24px 24px;text-align:center;overflow:auto;box-shadow:0 1px 2px rgba(0,0,0,.06);
}
.fc-front{font-family:var(--font-display);font-size:1.55rem;line-height:1.35;text-wrap:balance}
.fc-back{transform:rotateY(180deg);font-size:1.05rem;line-height:1.6}
.fc-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;width:min(100%,540px)}
.fc-btns{display:flex;flex-wrap:wrap;gap:8px}
.done-msg{margin:0;font-family:var(--font-display);font-size:1.3rem;text-align:center}
.fc-done{display:grid;gap:12px;justify-items:center;padding:24px 0}
@media (prefers-reduced-motion:reduce){.fc-inner{transition:none}}

/* Quiz */
.qz-box{display:grid;gap:12px;width:min(100%,640px)}
.qz-top{display:flex;justify-content:space-between;gap:10px}
.qz-q{margin:0;font-weight:700;font-size:1.12rem;line-height:1.5}
.qz-opts{display:grid;gap:8px}
.qz-opt{display:flex;align-items:baseline;gap:12px;text-align:start;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:10px 14px;cursor:pointer;line-height:1.5}
.qz-opt:hover:not(:disabled){border-color:var(--pen)}
.qz-opt:disabled{cursor:default}
.qz-opt b{font-family:var(--font-hand);font-size:1.3rem;line-height:1;color:var(--muted);flex:none}
.qz-opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok)}
.qz-opt.right b{color:var(--ok)}
.qz-opt.wrong{border-color:var(--margin);box-shadow:inset 0 0 0 1px var(--margin)}
.qz-opt.wrong span{text-decoration:line-through;text-decoration-color:var(--margin)}
.qz-exp{margin:0;padding:10px 14px;border-inline-start:3px solid var(--ok);background:var(--paper);border-radius:0 8px 8px 0}
[dir="rtl"] .qz-exp{border-radius:8px 0 0 8px}
.big-score{margin:0;font-family:var(--font-display);font-size:2rem;font-variant-numeric:tabular-nums}

/* Focus timer */
.timer{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:24px 40px;width:100%}
.dial{position:relative;width:220px;max-width:100%;aspect-ratio:1}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .track{fill:none;stroke:var(--rule);stroke-width:8}
.dial .prog{fill:none;stroke:var(--pen);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.dial.break .prog{stroke:var(--ok)}
.dial-text{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:2px;padding:24px}
.tm-time{font-family:var(--font-display);font-size:2.6rem;line-height:1.1;font-variant-numeric:tabular-nums;direction:ltr}
.tm-mode{color:var(--muted);font-size:.9rem;font-weight:700}
.tm-for{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere;max-width:150px}
.timer-side{display:grid;gap:14px;flex:0 1 320px;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft);box-shadow:inset 0 0 0 1px var(--pen)}
.tm-lens{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tm-len{border:0;margin:0;padding:0;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tm-len legend{padding:0;margin-bottom:4px;font-size:.9rem;font-weight:700;color:var(--muted)}
.tm-len label{display:grid;gap:2px;font-size:.8rem;color:var(--muted)}
.tm-len input{width:100%;font-variant-numeric:tabular-nums}
.tm-time.long{font-size:2rem}
.tm-presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:-6px}
.tm-presets button{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:2px 10px;font-size:.85rem;cursor:pointer;font-variant-numeric:tabular-nums}
.tm-presets button:hover{border-color:var(--pen);color:var(--pen)}
.tm-presets button[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft)}
.today-min{margin:0;color:var(--muted)}
.today-min strong{color:var(--ink);font-size:1.2rem;font-variant-numeric:tabular-nums}
.mic{background:transparent}
.mic[aria-pressed="true"]{background:var(--pen);color:var(--on-pen);border-style:solid}

/* Reminders: a sticky note above the list */
.reminders{background:var(--hi);color:var(--ink);border-radius:var(--radius);padding:14px clamp(16px,3vw,24px);display:grid;gap:8px}
.rem-title{font-family:var(--font-hand);font-weight:600;font-size:1.7rem;line-height:1;margin:0}
.rem-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rem-item{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding-top:8px;border-top:1px dashed var(--muted)}
.rem-item:first-child{border-top:0;padding-top:0}
.rem-name{font-weight:700;min-width:0;overflow-wrap:anywhere}
.rem-item .pill{border-color:var(--ink)}
.rem-actions{display:flex;flex-wrap:wrap;gap:6px;margin-inline-start:auto}
.rem-item .tool{background:var(--sheet);border-color:transparent}
</style>

// Photos are shrunk to at most 1600px so they upload quickly.
async function photoData(file){
  try{
    const bmp=await createImageBitmap(file), k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",0.85);
  }catch(e){
    return new Promise((ok,fail)=>{const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=()=>fail({code:"image_rejected"}); r.readAsDataURL(file)});
  }
}
// The open model sometimes slips letters from another alphabet into a word (Arabic run into Devanagari, say).
// Letters from a script the reply language doesn't use are removed: always when they are stuck to the reply's own
// letters, and everywhere unless the student asked for a translation, which may quote the original. Code is left alone.
const SCRIPT_OF = {ar:"Arabic",ur:"Arabic",fa:"Arabic",ps:"Arabic",hi:"Devanagari",mr:"Devanagari",bn:"Bengali",pa:"Gurmukhi",
  ta:"Tamil",te:"Telugu",am:"Ethiopic",zh:"Han",ja:"Han",ko:"Hangul",ru:"Cyrillic"};
const SCRIPTS = ["Latin","Arabic","Devanagari","Bengali","Gurmukhi","Gujarati","Tamil","Telugu","Kannada","Malayalam","Sinhala","Ethiopic",
  "Han","Hiragana","Katakana","Hangul","Cyrillic","Thai","Hebrew","Myanmar","Khmer","Georgian","Armenian"];
function fixScript(text, code, keepWords){
  const own = SCRIPT_OF[code] || "Latin";
  const allowed = new Set(["Latin", own].concat(code==="ja" ? ["Hiragana","Katakana"] : []));
  const foreign = SCRIPTS.filter(s=>!allowed.has(s)).map(s=>"\\p{Script="+s+"}").join("|");
  const strayRe = new RegExp("(?:"+foreign+")[\\p{M}\\u200c\\u200d]*","gu"), hasStray = new RegExp(foreign,"u");
  const ownRe = new RegExp("\\p{Script="+own+"}","u");
  return String(text).split(/(```[\s\S]*?(?:```|$)|`[^`\n]*`|\[\[\s*quran[^\]]*\]\])/i).map((part,i)=>{
    if(i%2) return part;
    return part.replace(/[\p{L}\p{M}\p{N}‌‍]+/gu, w => !hasStray.test(w) || (keepWords && !ownRe.test(w)) ? w : w.replace(strayRe,""))
      .replace(/[ \t]{2,}/g," ");
  }).join("");
}
function fixAll(v, code){
  if(typeof v==="string") return fixScript(v, code, false);
  if(Array.isArray(v)) return v.map(x=>fixAll(x, code));
  if(v && typeof v==="object"){const o={}; for(const k in v) o[k]=fixAll(v[k], code); return o}
  return v;
}
function webSample(){
  async function post(body, signal){
    let res;
    try{res=await fetch(WEB_AI,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal})}
    catch(e){throw {code: signal && signal.aborted ? "cancelled" : "network"}}
    if(!res.ok){let code="generic"; try{code=(await res.json()).error||code}catch(e){} throw {code}}
    return res;
  }
  const sample=async(turns, opts={})=>{
    const code=opts.lang||$("answerLang").value, task=(document.querySelector('input[name="task"]:checked')||{}).value;
    const keep=opts.keepWords!==undefined ? opts.keepWords : task==="translate";
    const clean=s=>fixScript(s.replace(WEB_CUT,""), code, keep);
    const body={messages:turns.map(m=>({role:m.role,content:String(m.content)})), lang:langInfo(code)[2]};
    if(opts.images && opts.images.length) body.images=await Promise.all([...opts.images].slice(0,4).map(photoData));
    const res=await post(body, opts.signal);
    const reader=res.body.getReader(), dec=new TextDecoder();
    let text="";
    try{
      for(;;){
        const {done,value}=await reader.read(); if(done) break;
        text+=dec.decode(value,{stream:true});
        if(opts.onText) opts.onText({text:clean(text)});
      }
    }catch(e){throw {code: opts.signal && opts.signal.aborted ? "cancelled" : "network", text:clean(text)}}
    const truncated=text.includes(WEB_CUT); text=clean(text);
    if(!text.trim()) throw {code:"generic"};
    return {text, truncated};
  };
  // The model sometimes wraps JSON in a code fence; take the first array or object in its reply.
  sample.json=async(prompt, opts={})=>{
    const code=$("answerLang").value;
    const res=await post({json:true,lang:langInfo(code)[2],messages:[{role:"user",content:String(prompt)+"\n\nReply with only the JSON, no other text."}]}, opts.signal);
    const {text}=await res.json();
    const s=String(text||""), at=s.search(/[\[{]/), end=Math.max(s.lastIndexOf("]"),s.lastIndexOf("}"));
    let v; try{v=JSON.parse(s.slice(at,end+1))}catch(e){throw {code:"invalid_json"}}
    return fixAll(v, code);
  };
  sample.limits=async()=>({images:{maxCount:4}});
  return sample;
}
function webTTS(){
  const synth=window.speechSynthesis; if(!synth || !window.SpeechSynthesisUtterance) return null;
  let handlers=[], state="idle";
  const set=s=>{state=s; handlers.forEach(h=>h({state}))};
  return {
    speak(lines){
      synth.cancel();
      return new Promise(done=>{
        lines.forEach((l,i)=>{
          const u=new SpeechSynthesisUtterance(l.text); u.lang=SPEECH_LANG[l.language]||l.language||"";
          if(i===lines.length-1){u.onend=()=>{set("idle");done()}; u.onerror=()=>{set("idle");done()}}
          synth.speak(u);
        });
        set("speaking");
      });
    },
    stop(){synth.cancel(); set("idle")},
    onState(h){handlers.push(h); return ()=>{handlers=handlers.filter(x=>x!==h)}}
  };
}
function webDictation(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return null;
  let rec=null, partial=[], finals=[], states=[];
  const emit=(list,e)=>list.forEach(h=>h(e));
  const on=list=>h=>{list.push(h); return ()=>{const i=list.indexOf(h); if(i>=0) list.splice(i,1)}};
  return {
    start(o={}){
      return new Promise((ok,fail)=>{
        rec=new SR(); rec.lang=SPEECH_LANG[o.language]||o.language||navigator.language; rec.continuous=true; rec.interimResults=true;
        rec.onstart=()=>{emit(states,{state:"listening"}); ok()};
        rec.onresult=e=>{
          let live="";
          for(let i=e.resultIndex;i<e.results.length;i++){
            const r=e.results[i];
            if(r.isFinal) emit(finals,{text:r[0].transcript.trim()}); else live+=r[0].transcript;
          }
          emit(partial,{text:live});
        };
        rec.onerror=e=>{const code=e.error==="not-allowed"||e.error==="service-not-allowed"?"not_granted":e.error==="language-not-supported"?"unavailable":"upstream_error"; fail({code})};
        rec.onend=()=>{rec=null; emit(states,{state:"idle"})};
        emit(states,{state:"starting"});
        try{rec.start()}catch(e){fail({code:"upstream_error"})}
      });
    },
    stop(){if(rec) rec.stop(); return Promise.resolve()},
    onPartial:on(partial), onFinal:on(finals), onState:on(states)
  };
}

/* ---------- Quran verses ----------
   Answers never write out a verse: they write a marker like [[quran:2:128]], and the page fills in the exact Arabic
   text, with a published translation in the answer's language when there is one, from the alquran.cloud database. */
const QURAN_API = "https://api.alquran.cloud/v1/ayah/";
const QURAN_TR = {en:"en.sahih",ur:"ur.jalandhry",hi:"hi.hindi",bn:"bn.bengali",es:"es.cortes",fr:"fr.hamidullah",zh:"zh.jian",
  tr:"tr.diyanet",id:"id.indonesian",ms:"ms.basmeih",sw:"sw.barwani",de:"de.bubenheim",it:"it.piccardo",ru:"ru.kuliev",
  fa:"fa.fooladvand",ps:"ps.abdulwali",ta:"ta.tamil",ja:"ja.japanese",ko:"ko.korean",so:"so.abduh",ha:"ha.gumi",am:"am.sadiq",pt:"pt.elhayek"};
const QURAN_RE = /\[\[\s*quran\s*:\s*(\d{1,3})\s*:\s*(\d{1,3})(?:\s*-\s*(\d{1,3}))?\s*(?:\|\s*([^\]|]{0,40}))?\s*\]\]/gi;
const quranCache = {};  // "2:128|en" -> {ar, tr, name, en} once loaded, "loading" or "failed"
const quranFound = {};  // "2:128|word" -> the verse near 2:128 that contains the word, or "loading"
let quranRedraw = 0;
function quranRedrawSoon(){clearTimeout(quranRedraw); quranRedraw=setTimeout(render,30)}
const quranPlain = t => String(t).replace(/[ؐ-ًؚ-ٰٟۖ-ۭـ]/g,"").replace(/[ٱأإآ]/g,"ا").replace(/ى/g,"ي").replace(/\s+/g," ");
// Models know what a verse means better than its number. The marker carries the model's guess and two or three key
// English words from the verse's meaning. The page fetches the real verses around the guess (Saheeh International
// translation) and asks the model which of them the answer means, given the student's question and the sentence
// around the marker: picking from real text is far more reliable than recalling a number. If that fails, the verse
// whose translation has the most of the key words is used, else the guess.
function quranFind(s, a, words, ctx){
  const key=s+":"+a+"|"+words;
  if(quranFound[key]===undefined){
    quranFound[key]="loading";
    const from=Math.max(1,a-5);
    fetch("https://api.alquran.cloud/v1/surah/"+s+"/en.sahih?offset="+(from-1)+"&limit=11").then(r=>r.ok?r.json():Promise.reject())
      .then(async j=>{
        const ayahs=j.data.ayahs, nums=ayahs.map(v=>v.numberInSurah);
        const stems=String(words).toLowerCase().split(/[^a-z']+/).filter(w=>w.length>2).slice(0,5).map(w=>w.length>4 ? w.replace(/(ing|ed|es|s)$/,"") : w);
        const scored=ayahs.map(v=>{const t=v.text.toLowerCase(); return {n:v.numberInSurah, score:stems.filter(w=>new RegExp("\\b"+w).test(t)).length}})
          .filter(x=>x.score>0).sort((x,y)=>(y.score-x.score)||(Math.abs(x.n-a)-Math.abs(y.n-a)));
        let pick=scored.length ? scored[0].n : a;
        const sample=await samplePromise;
        if(sample && sample.json) try{
          const v=await sample.json([
            'A student asked: "'+lastQuestion().slice(0,600)+'"',
            'An answer quotes a verse of the Quran at this point: "'+ctx+'"',
            "The answer's guess was surah "+s+", verse "+a+", about: "+words+".",
            "These are the real verses near that guess (Saheeh International translation):",
            ...ayahs.map(v=>s+":"+v.numberInSurah+" — "+v.text),
            "",
            "The answer's guess may be wrong. Judge by the meaning of the verses: which one of them best matches what the student asked for?",
            "Reply with only JSON like {\"verse\": "+a+"}."
          ].join("\n"),{modelTier:"quick",cache:false});
          const n=Number(v && v.verse);
          if(nums.includes(n)) pick=n;
        }catch(e){}
        quranFound[key]=pick;
      })
      .catch(()=>{quranFound[key]=a})
      .finally(quranRedrawSoon);
  }
  return quranFound[key];
}
function lastQuestion(){for(let i=thread.length-1;i>=0;i--) if(thread[i].role==="user") return String(thread[i].text||""); return ""}
function quranVerse(s, a, code){
  const key=s+":"+a+"|"+code;
  if(quranCache[key]===undefined){
    quranCache[key]="loading";
    const eds=["quran-uthmani"].concat(code!=="ar" && QURAN_TR[code] ? [QURAN_TR[code]] : []);
    fetch(QURAN_API+s+":"+a+"/editions/"+eds.join(",")).then(r=>r.ok?r.json():Promise.reject())
      .then(j=>{
        const d=j.data;
        // The database starts verse 1 of most surahs with the basmala; the verse itself follows it.
        let ar=d[0].text; if(a===1 && s!==1) ar=ar.replace(/^\S+\s+\S+\s+\S+\s+\S+\s+/,"");
        quranCache[key]={ar, tr:d[1]?d[1].text:"", name:d[0].surah.name, en:d[0].surah.englishName};
      })
      .catch(()=>{quranCache[key]="failed"})
      .finally(quranRedrawSoon);
  }
  return quranCache[key];
}
function quranize(text, code){
  return String(text).replace(QURAN_RE,(m,s,a,b,word,at,all)=>{
    s=+s; a=+a;
    if(s<1 || s>114 || a<1) return m;
    if(word && !b){
      const ctx=(all.slice(Math.max(0,at-300),at)+" [VERSE] "+all.slice(at+m.length,at+m.length+120)).replace(QURAN_RE,"").replace(/\s+/g," ");
      const found=quranFind(s,a,word,ctx);
      if(found==="loading") return " ("+(code==="ar" ? "القرآن " : "Quran ")+s+":"+a+") ";
      a=found;
    }
    b=b?Math.min(+b,+a+4):a;
    if(b<a) return m;
    const vs=[]; let ready=true;
    for(let i=a;i<=b;i++){const v=quranVerse(s,i,code); if(typeof v==="object") vs.push(v); else ready=false}
    const where=s+":"+a+(b>a?"-"+b:"");
    const ref=vs[0] ? (code==="ar" ? vs[0].name : vs[0].en)+" "+where : (code==="ar" ? "القرآن " : "Quran ")+where;
    if(!ready) return " ("+ref+") ";
    const ar=vs.map(v=>v.ar).join(" ۝ "), tr=vs.map(v=>v.tr).filter(Boolean).join(" ");
    const verse = window.marked && window.DOMPurify ? '<span class="ayah" lang="ar" dir="rtl">«'+ar+'»</span>' : "«"+ar+"»";
    return "\n\n> "+verse+" ("+ref+")"+(tr?"\n>\n> "+tr:"")+"\n\n";
  });
}

let raf=0;

function buildPrompt(q){

  const [code,native,english]=langInfo($("answerLang").value);

    "Kind of help wanted: "+TASK_RULES[task],
    "",
    "Write your whole reply in "+english+" ("+native+"), whatever language the assignment is written in. Keep numbers, variables and formulas in standard notation.",
    "",
    "Formatting rules:",
    "- Use Markdown: short paragraphs, **bold** step titles, numbered or bulleted lists where they help.",
    "- Put every equation, formula, chemical formula and short code expression inside backticks, like `2x + 6 = 14`. Use plain Unicode maths symbols (×, ÷, −, ², √, π, ≤). Never use LaTeX or dollar-sign maths.",
    "- Put longer code in fenced code blocks.",
    "- Write quotations in "+english+" too, never in another language.",

    "- Quote a verse only when you are sure of its exact wording and of who said it and where it is. Never attribute a verse to a different prophet, person or surah. If you are not sure, describe it in your own words instead of quoting it. If the student's own text quotes or names a verse, keep the student's verse and don't swap it for another."
    ] : [
    "- Never write out a verse of the Quran yourself, not even part of one. To quote a verse, write only its marker: the surah number, the verse number and two or three key English words from the verse's meaning, in the form [[quran:SURAH:VERSE|WORDS]], for example [[quran:94:6|hardship ease]]. Always write the marker exactly like that, in English letters, whatever language you reply in. For a short passage, use a range like [[quran:SURAH:FIRST-LAST]]. The page replaces the marker with the exact Arabic verse, its reference and a published translation, so don't add the verse text, its meaning or its verse number anywhere else in your reply.",
    "- Use a marker only when you are sure which verse it is. Never attribute a verse to a different prophet, person or surah. If you are not sure of the verse number, describe the verse in your own words without a marker. If the student's own text quotes or names a verse, use the marker for that same verse."
    ]),
    "- Quote a hadith only when you are sure of its wording and source, and name the collection it is in.",
    "- Match the explanation to the student's level and define any technical word the first time you use it.",

    "",
    "The student's assignment:",

    '"""',

    : photos.length ? "A picture is attached: a photo or screenshot of the assignment or of the topic to explain. Read it carefully, including any text, diagrams or working in it." : "",
    "",
    "Remember: write the whole reply in "+english+" ("+native+")."
  ].join("\n");

// The free helper allows a few requests a minute: when it says it is busy, wait 20 s and try again (up to 6 times).
async function retryBusy(call, signal){
  for(let tries=0;;tries++){
    try{return await call()}
    catch(e){
      if(!(e && e.code==="rate_limited") || tries>=6) throw e;
      await new Promise((ok,fail)=>{const id=setTimeout(ok,20000); signal.addEventListener("abort",()=>{clearTimeout(id); fail({code:"cancelled"})},{once:true})});
    }
  }
}
// Writes down what one group of pictures contains, for a question with more pictures than one request carries.
async function readPictures(sample, group, from, total, signal){
  const prompt=[
    "These are pictures "+(from+1)+" to "+(from+group.length)+" of "+total+" that a student attached: photos or screenshots of an assignment or of a topic to explain.",
    "Write down everything in them, picture by picture, starting each with \"Picture N:\" and numbering from "+(from+1)+".",
    "Copy all text, questions, numbers and equations exactly, in their original language, and briefly describe any diagram, table or drawing. Don't answer or explain anything yet."
  ].join("\n");
  const opts=IN_CLAUDE ? {images:group, signal, cache:false} : {images:group, signal, keepWords:true};
  return (await retryBusy(()=>sample([{role:"user",content:prompt}], opts), signal)).text;
}
async function run(extra){
  const sample = await samplePromise;
  if(!sample){setStatus(t("unavailable")); return}
  const code=$("answerLang").value;
  busy=true; ctl=new AbortController(); setStatus("");
  $("askBtn").disabled=true; $("stopBtn").hidden=false;
  const entry={role:"assistant",text:"",lang:code,pending:true};
  thread.push(entry); render();
  if(matchMedia("(max-width:900px)").matches) $("answerSheet").scrollIntoView({behavior:"smooth",block:"start"});
  try{
    const opts={signal:ctl.signal,cache:false,onText:({text})=>{entry.text=text;entry.pending=false;streamUpdate(entry)}};
    const images=extra && extra.images ? [...extra.images] : [];
    if(images.length>IMG_PER_CALL){
      // More pictures than one request carries: read them a group at a time, then answer from what was read.
      const notes=[];
      for(let i=0;i<images.length;i+=IMG_PER_CALL){
        const group=images.slice(i,i+IMG_PER_CALL);
        setStatus(t("imgReading").replace("{a}",i+1).replace("{b}",i+group.length).replace("{n}",images.length));
        notes.push(await readPictures(sample, group, i, images.length, ctl.signal));
      }
      setStatus("");
      const last=turns.length-1;
      turns[last]={role:"user",content:turns[last].content+"\n\nThe pictures were too many to send at once, so here is everything in them, as read picture by picture:\n\n"+notes.join("\n\n")};
    } else if(images.length) opts.images=images;
    const res=images.length>IMG_PER_CALL ? await retryBusy(()=>sample(turns.slice(), opts), ctl.signal) : await sample(turns.slice(), opts);
    entry.text=res.text;
    turns.push({role:"assistant",content:res.text});
    if(res.truncated) setStatus(t("cut"));
    if(code!=="en" && $("alsoEn").checked) translateLater=entry;
  }catch(err){
    const c=err && err.code;
    entry.text = c==="refused" ? "" : ((err && err.text) || "");
    if(entry.text) turns.push({role:"assistant",content:entry.text});
    else thread.splice(thread.indexOf(entry),1);
    if(c==="image_rejected"){clearPhoto()}
    if(c!=="cancelled") setStatus(msgFor(c));
  }finally{
    entry.pending=false; busy=false; ctl=null;
    $("askBtn").disabled=false; $("stopBtn").hidden=true;
    render();
  }
  if(translateLater){const e=translateLater; translateLater=null; translateEntry(e)}
}

// An English translation under an answer. It is shown with the answer but kept out of the conversation,
// so follow-up questions still go on in the answer's language.
let translateLater=null;
async function translateEntry(entry){
  const sample=await samplePromise;
  if(!sample || busy || !entry.text) return;
  busy=true; ctl=new AbortController(); setStatus("");
  $("askBtn").disabled=true; $("stopBtn").hidden=false;
  entry.en={text:"",pending:true,el:null,lang:"en"}; render();
  const ask=[{role:"user",content:[
    "Translate the text below into English. Keep the same Markdown layout: headings, bold, lists and paragraphs.",
    "Translate quotations too. Keep every marker like [[quran:2:128]] exactly as it is: the page fills in that verse and its English translation.",
    "Keep anything inside backticks exactly as it is. Reply with only the translation, with no note before or after it.",
    "", '"""', entry.text, '"""'].join("\n")}];
  const opts={signal:ctl.signal,cache:false,onText:({text})=>{entry.en.text=text;entry.en.pending=false;streamUpdate(entry.en)}};
  if(!IN_CLAUDE){opts.lang="en"; opts.keepWords=true}
  try{
    const res=await sample(ask, opts);
    entry.en.text=res.text;
    if(res.truncated) setStatus(t("cut"));
  }catch(err){
    const c=err && err.code;
    if(err && err.text) entry.en.text=err.text; else entry.en=null;
    if(c!=="cancelled") setStatus(msgFor(c));
  }finally{
    if(entry.en) entry.en.pending=false;
    busy=false; ctl=null;
    $("askBtn").disabled=false; $("stopBtn").hidden=true;
    render();
  }
}

/* ---------- Photos and screenshots ---------- */
// Pictures go with a question: picked, pasted (Ctrl+V) or dropped on the form.
// Previews are small data URLs, since some pages block blob: links in <img>.
async function toImage(f){
  if(IMG_TYPES.includes(f.type)) return f;
  if(!/^image\//.test(f.type)) return null;
  try{  // e.g. an iPhone HEIC photo: turn it into a JPEG where the browser can read it
    const bmp=await createImageBitmap(f), c=document.createElement("canvas"); c.width=bmp.width; c.height=bmp.height;
    c.getContext("2d").drawImage(bmp,0,0);
    const b=await new Promise(ok=>c.toBlob(ok,"image/jpeg",0.9));
    return b ? new File([b],"photo.jpg",{type:"image/jpeg"}) : null;
  }catch(e){return null}
}
async function thumbOf(file){
  try{
    const bmp=await createImageBitmap(file), k=Math.min(1,320/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",0.8);
  }catch(e){
    return new Promise(ok=>{const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=()=>ok(""); r.readAsDataURL(file)});
  }
}
async function addPhotos(list){
  const files=[...(list||[])]; if(!files.length) return;
  const imgs=(await Promise.all(files.map(toImage))).filter(Boolean);
  if(!imgs.length){setStatus(t("imgType")); return}
  setStatus(imgs.length<files.length ? t("imgType") : "");
  for(const file of imgs) photos.push({file, thumb:await thumbOf(file)});
  renderThumbs();
}
function renderThumbs(){
  const box=$("thumbs"); box.innerHTML="";
  photos.forEach(p=>{
    const fig=document.createElement("figure");
    const img=document.createElement("img"); img.src=p.thumb; img.alt="";
    const x=document.createElement("button"); x.type="button"; x.setAttribute("aria-label",t("photoRemove")); x.title=t("photoRemove");
    x.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>';
    x.addEventListener("click",()=>{photos=photos.filter(o=>o!==p); renderThumbs()});
    fig.append(img,x); box.append(fig);
  });
  box.hidden=!photos.length;
}
function clearPhoto(){photos=[]; $("photo").value=""; renderThumbs()}
$("photo").addEventListener("change",e=>{addPhotos(e.target.files).finally(()=>{$("photo").value=""})});
// A screenshot pasted anywhere on the question form, or on the page itself, is added as a picture.
document.addEventListener("paste",e=>{
  if($("photoField").hidden) return;
  const tg=e.target, onForm=$("askForm").contains(tg) || tg===document.body || tg===document.documentElement;
  const files=[...((e.clipboardData && e.clipboardData.files) || [])].filter(f=>/^image\//.test(f.type));

const dropOK=e=>!$("photoField").hidden && e.dataTransfer && [...e.dataTransfer.types].includes("Files");
$("askForm").addEventListener("dragover",e=>{if(!dropOK(e)) return; e.preventDefault(); $("askForm").classList.add("dropping")});

function lastAnswer(){const all=$("page").querySelectorAll(".a:not(.a-en)"); return all[all.length-1]}
// Copy takes the last answer and, when there is one, its English translation under it.
$("copyBtn").addEventListener("click",()=>{
  const a=lastAnswer(); if(!a) return;
  const wrap=a.nextElementSibling && a.nextElementSibling.classList.contains("en-wrap") ? a.nextElementSibling : null;
  const text=a.innerText+(wrap ? "\n\n"+wrap.innerText : "");
  const done=()=>{$("copyBtn").textContent=t("copied"); setTimeout(()=>{$("copyBtn").textContent=t("copy")},1500)};
  const select=()=>{const r=document.createRange(); r.setStartBefore(a); r.setEndAfter(wrap||a); const s=getSelection(); s.removeAllRanges(); s.addRange(r)};
  try{navigator.clipboard.writeText(text).then(done,select)}catch(e){select()}
});
function updateListen(){$("listenBtn").textContent = speaking ? t("stopListen") : t("listen")}
function chunks(text){
  const out=[];
  text.split(/\n+/).map(s=>s.trim()).filter(Boolean).forEach(p=>{
    while(p.length>1800){out.push(p.slice(0,1800)); p=p.slice(1800)}
    out.push(p);
  });
  return out;
}
ttsPromise.then(x=>{
  tts=x; $("listenBtn").hidden=!x;
  if(x) x.onState(({state})=>{speaking = state!=="idle"; updateListen()});
});

  const a=lastAnswer(); if(!a) return;
  const lines=chunks(a.innerText).map(text=>({text,language:a.lang}));
  if(!lines.length) return;
  tts.speak(lines).catch(e=>{if(e && e.code==="not_granted") $("listenBtn").hidden=true});
});

function exampleQuiz(){return {items:[{q:"`2x + 6 = 14`  →  x = ?",options:["3","4","5","8"],answer:1,why:"`2x = 14 − 6 = 8`  →  `x = 8 ÷ 2 = 4`"}],i:0,score:0,picked:null,example:true,lang:ui}}

function setTab(name){
  toolTab=name;
  document.querySelectorAll(".tabs [role=tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===name)));
  ["cards","quiz","timer"].forEach(n=>{$("pane-"+n).hidden = n!==name});
  $("topicRow").hidden = $("toolsIntro").hidden = name==="timer";
  $("makeBtn").textContent = name==="quiz" ? t("makeQuiz") : t("makeCards");
  toolsStatus("");
}
document.querySelectorAll(".tabs [role=tab]").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));

function renderTools(){
  $("topic").placeholder=t("topicPh");
  if(!deck || deck.example) deck=exampleDeck();
  if(!quiz || quiz.example) quiz=exampleQuiz();
  if(!toolsBusy) setTab(toolTab);
  renderDeck(); renderQuiz(); renderTimer();
  $("micLbl").textContent = listening ? t("listening") : t("mic");
}

/* Flashcards */
function renderDeck(){
  const done=deck.queue.length===0;
  $("fcTag").hidden=!deck.example; $("fcard").hidden=done; $("fcDone").hidden=!done;
  $("fcProgress").textContent=(deck.cards.length-deck.queue.length)+" / "+deck.cards.length+" ✓";
  $("fcFlip").hidden=done||deck.flipped; $("fcGot").hidden=done||!deck.flipped; $("fcAgain").hidden=done||!deck.flipped;
  if(done) return;
  const c=deck.cards[deck.queue[0]];
  $("fcFront").innerHTML=mdInline(c.front); $("fcBack").innerHTML=mdInline(c.back);
  setLangDir($("fcFront"),deck.lang); setLangDir($("fcBack"),deck.lang);
  $("fcard").classList.toggle("flipped",deck.flipped);
  $("fcard").setAttribute("aria-pressed",String(deck.flipped));
  $("fcard").setAttribute("aria-label",t("flip"));
}
function flipCard(){if(!deck.queue.length) return; deck.flipped=!deck.flipped; renderDeck()}
function nextCard(){
  // Turn the card back without animating, so the next answer is never seen mid-flip.
  const card=$("fcard"); card.classList.add("instant"); deck.flipped=false; renderDeck();
  void card.offsetWidth; card.classList.remove("instant");
}
$("fcard").addEventListener("click",flipCard);
$("fcard").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flipCard()}});
$("fcFlip").addEventListener("click",flipCard);
$("fcGot").addEventListener("click",()=>{deck.queue.shift(); nextCard(); if(!deck.queue.length) $("fcRestart").focus()});
$("fcAgain").addEventListener("click",()=>{deck.queue.push(deck.queue.shift()); nextCard()});
$("fcRestart").addEventListener("click",()=>{deck.queue=deck.cards.map((_,i)=>i); nextCard()});

/* Quiz */
function renderQuiz(){
  const q=quiz, finished=q.i>=q.items.length;
  $("qzTag").hidden=!q.example; $("qzBox").hidden=finished; $("qzDone").hidden=!finished;
  setLangDir($("qzBox"),q.lang);
  if(finished){$("qzFinal").textContent=t("score")+": "+q.score+" / "+q.items.length; return}
  const it=q.items[q.i];
  $("qzProgress").textContent=(q.i+1)+" / "+q.items.length;
  $("qzScore").textContent="✓ "+q.score;
  $("qzQ").innerHTML=mdInline(it.q);
  const opts=$("qzOpts"); opts.innerHTML="";
  it.options.forEach((o,idx)=>{
    const b=document.createElement("button"); b.type="button"; b.className="qz-opt";
    if(q.picked!==null){b.disabled=true; if(idx===it.answer) b.classList.add("right"); else if(idx===q.picked) b.classList.add("wrong")}
    const n=document.createElement("b"); n.textContent=String(idx+1);
    const s=document.createElement("span"); s.innerHTML=mdInline(o);
    b.append(n,s); b.addEventListener("click",()=>pickAnswer(idx)); opts.append(b);
  });
  $("qzExp").hidden=q.picked===null; $("qzExp").innerHTML=mdInline(it.why||"");
  $("qzNext").hidden=q.picked===null;
  $("qzNext").textContent = q.i===q.items.length-1 ? t("quizDone") : t("next");
}
function pickAnswer(idx){
  if(quiz.picked!==null) return;
  quiz.picked=idx; if(idx===quiz.items[quiz.i].answer) quiz.score++;
  renderQuiz(); $("qzNext").focus();
}
$("qzNext").addEventListener("click",()=>{quiz.i++; quiz.picked=null; renderQuiz()});
$("qzRestart").addEventListener("click",()=>{quiz.i=0; quiz.score=0; quiz.picked=null; renderQuiz()});

/* Making cards or a quiz with Claude, in the "Answer in" language at the chosen level */
$("makeBtn").addEventListener("click",async()=>{
  if(toolsBusy) return;
  const topic=$("topic").value.trim().slice(0,12000);
  if(!topic){$("topic").focus(); return}
  const sample=await samplePromise;
  if(!sample){toolsStatus(t("unavailable")); return}
  const [code,native,english]=langInfo($("answerLang").value), level=LEVEL_EN[$("level").value];
  const kind=toolTab, btn=$("makeBtn");
  toolsBusy=true; btn.disabled=true; btn.textContent=t("thinking"); toolsStatus("");
  const common="Write everything in "+english+" ("+native+"). Put formulas in backticks using plain Unicode maths (×, ÷, −, ², √); never use LaTeX.\n\nTopic or notes:\n\"\"\"\n"+topic+"\n\"\"\"";
  try{
    if(kind==="quiz"){
      const v=await sample.json("Write a 5-question multiple-choice quiz for a "+level+" student on the topic or notes below. Each question has 4 options and exactly one correct option. Go from easier to harder. \"why\" is one or two sentences explaining the correct answer.\n"+
        'Reply with only a JSON array like [{"q":"...","options":["...","...","...","..."],"answer":0,"why":"..."}], where answer is the index of the correct option.\n'+common,{cache:false});
      const items=(Array.isArray(v)?v:[]).map(x=>({q:String((x&&x.q)||""), options:Array.isArray(x&&x.options)?x.options.map(String).slice(0,6):[], answer:Number(x&&x.answer), why:String((x&&x.why)||"")}))
        .filter(x=>x.q && x.options.length>=2 && Number.isInteger(x.answer) && x.answer>=0 && x.answer<x.options.length).slice(0,10);
      if(!items.length) throw {code:"invalid_json"};
      quiz={items,i:0,score:0,picked:null,example:false,lang:code}; renderQuiz();
    } else {
      const v=await sample.json("Make 10 flashcards for a "+level+" student from the topic or notes below. Front: a key term, question or idea (at most 12 words). Back: a clear answer or definition (at most 35 words).\n"+
        'Reply with only a JSON array like [{"front":"...","back":"..."}].\n'+common,{cache:false});
      const cards=(Array.isArray(v)?v:[]).map(x=>({front:String((x&&x.front)||"").trim(), back:String((x&&x.back)||"").trim()})).filter(x=>x.front&&x.back).slice(0,20);
      if(!cards.length) throw {code:"invalid_json"};
      deck={cards,queue:cards.map((_,i)=>i),flipped:false,example:false,lang:code}; nextCard();
    }
  }catch(e){toolsStatus(msgFor(e&&e.code))}
  finally{toolsBusy=false; btn.disabled=false; btn.textContent = toolTab==="quiz" ? t("makeQuiz") : t("makeCards")}
});

/* Focus timer: focus and break lengths are the student's own, in hours and minutes with no upper limit (25 and 5 minutes to start).
   Finished focus time counts for today and for the chosen assignment. */
const TM_HUGE=1e6, TM_PRESETS=[15,25,45,60,90,120], RING=2*Math.PI*52;  // TM_HUGE only keeps the numbers sane
const tmLen=(k,d)=>{const n=Math.round(Number(store.get("tm."+k)));return n>=1&&n<=TM_HUGE?n:d};
const TM_IN={focus:["tmFocusH","tmFocusLen","tmFocusSet"], brk:["tmBrkH","tmBrkLen","tmBrkSet"]};
const TM_LEN={focus:tmLen("focus",25), brk:tmLen("brk",5)};
let tm={mode:"focus", total:TM_LEN.focus*60, left:TM_LEN.focus*60, end:0, running:false, iv:0}, audio=null;
$("tmRing").style.strokeDasharray=String(RING);
function focusToday(){return Number(store.get("focus."+todayISO()))||0}
function mmss(s){
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), p=n=>String(n).padStart(2,"0");
  return (h ? h+":"+p(m) : p(m))+":"+p(s%60);
}
// A length in minutes as words: "25 min", "1 h", "2 h 30 min"
function lenText(min){
  const h=Math.floor(min/60), m=min%60;
  return h ? h+" "+t("hShort")+(m ? " "+m+" "+t("minLbl") : "") : m+" "+t("minLbl");
}
function renderTimer(){
  $("tmTime").textContent=mmss(tm.left); $("tmTime").classList.toggle("long",tm.left>=3600);
  $("tmMode").textContent = tm.mode==="focus" ? t("focus") : t("brk");
  $("tmRing").style.strokeDashoffset=String(RING*(1-tm.left/tm.total));
  $("dial").classList.toggle("break",tm.mode==="brk");
  $("tmStart").textContent = tm.running ? t("pause") : t("start");
  $("tmFocusBtn").textContent=t("focus")+" · "+lenText(TM_LEN.focus); $("tmBreakBtn").textContent=t("brk")+" · "+lenText(TM_LEN.brk);
  $("tmFocusBtn").setAttribute("aria-pressed",String(tm.mode==="focus")); $("tmBreakBtn").setAttribute("aria-pressed",String(tm.mode==="brk"));
  $("tmToday").textContent=focusToday();
  const sel=$("tmTask"); $("tmFor").textContent = sel.value ? sel.options[sel.selectedIndex].textContent : "";
  // Fill the hours and minutes boxes, except while the student is typing in that pair
  Object.keys(TM_IN).forEach(k=>{
    const [h,m,set]=TM_IN[k].map($);
    if(!set.contains(document.activeElement)){h.value=Math.floor(TM_LEN[k]/60); m.value=TM_LEN[k]%60}
  });
  const pre=$("tmPresets"); pre.setAttribute("aria-label",t("focusLen"));
  if(!pre.children.length) TM_PRESETS.forEach(m=>{
    const b=document.createElement("button"); b.type="button"; b.dataset.min=m;
    b.addEventListener("click",()=>setLen("focus",m)); pre.append(b);
  });
  [...pre.children].forEach(b=>{b.textContent=lenText(Number(b.dataset.min)); b.setAttribute("aria-pressed",String(Number(b.dataset.min)===TM_LEN.focus))});
}
// A new length applies straight away when that timer is not running, otherwise from the next round.
function setLen(k, v){
  const n=Math.round(Number(v));
  if(!(n>=1)) {renderTimer(); return}
  TM_LEN[k]=Math.min(TM_HUGE,n); store.set("tm."+k,String(TM_LEN[k]));
  if(tm.mode===k && !tm.running) setMode(k); else renderTimer();
}
function setMode(m){clearInterval(tm.iv); tm={mode:m,total:TM_LEN[m]*60,left:TM_LEN[m]*60,end:0,running:false,iv:0}; renderTimer()}
function beep(){
  if(!audio) return;
  try{[0,0.35,0.7].forEach(at=>{
    const o=audio.createOscillator(), g=audio.createGain(), s=audio.currentTime+at;
    o.frequency.value=880; g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(0.25,s+0.02); g.gain.exponentialRampToValueAtTime(0.0001,s+0.25);
    o.connect(g).connect(audio.destination); o.start(s); o.stop(s+0.3);
  })}catch(e){}
}
function finishTimer(){
  beep();
  if(tm.mode==="focus"){
    const mins=Math.round(tm.total/60);
    store.set("focus."+todayISO(), String(focusToday()+mins));
    const it=hw.find(x=>x.id===$("tmTask").value);
    if(it) hwUpdate(it,{mins:it.mins+mins});
    setMode("brk");
  } else setMode("focus");
}
function tickTimer(){
  tm.left=Math.max(0,Math.round((tm.end-Date.now())/1000));
  if(tm.left<=0) finishTimer(); else renderTimer();
}
$("tmStart").addEventListener("click",()=>{
  if(tm.running){clearInterval(tm.iv); tm.left=Math.max(1,Math.round((tm.end-Date.now())/1000)); tm.running=false; renderTimer(); return}
  try{audio=audio||new (window.AudioContext||window.webkitAudioContext)(); if(audio.resume) audio.resume()}catch(e){audio=null}
  tm.end=Date.now()+tm.left*1000; tm.running=true; tm.iv=setInterval(tickTimer,500); renderTimer();
});
$("tmReset").addEventListener("click",()=>setMode(tm.mode));
$("tmFocusBtn").addEventListener("click",()=>setMode("focus"));
$("tmBreakBtn").addEventListener("click",()=>setMode("brk"));
$("tmTask").addEventListener("change",renderTimer);
// Hours and minutes add up, so 150 minutes or 2 hours 30 minutes give the same length; it is tidied once the boxes are left.
Object.keys(TM_IN).forEach(k=>{
  const [h,m,set]=TM_IN[k].map($);
  const apply=()=>setLen(k,(Math.max(0,Number(h.value)||0))*60+Math.max(0,Number(m.value)||0));
  h.addEventListener("change",apply); m.addEventListener("change",apply);
  set.addEventListener("focusout",e=>{if(!set.contains(e.relatedTarget)) setTimeout(renderTimer,0)});
});
function refreshTimerTasks(){
  const sel=$("tmTask"), cur=sel.value; sel.innerHTML="";
  const any=document.createElement("option"); any.value=""; any.textContent=t("nothing"); sel.append(any);
  hw.filter(x=>!x.done).sort((a,b)=>(a.due||"9999")<(b.due||"9999")?-1:1).forEach(x=>{
    const o=document.createElement("option"); o.value=x.id; o.textContent=x.name; sel.append(o);
  });
  sel.value = [...sel.options].some(o=>o.value===cur) ? cur : "";
  renderTimer();
}

// Signed-in viewers keep their list privately in the artifact's database (data/users/<id>/...).
// Anywhere else it lives in this browser only.
let hw = [], hwMode = "pending", hwCol = null;
const ISO = /^\d{4}-\d{2}-\d{2}$/;
function hwLocalLoad(){try{const v=JSON.parse(store.get("homework")||"[]");return Array.isArray(v)?v:[]}catch(e){return []}}
function hwLocalSave(){store.set("homework",JSON.stringify(hw))}
// Daily goals live in the same collection as homework, marked kind:"goal" ({t: text, d: day, done})
let goals = [], selDay = todayISO();
function goalClean(id,d){return {id, t:String(d.t||"").slice(0,200), d:ISO.test(d.d)?d.d:"", done:!!d.done, created:Number(d.created)||0}}
function goalsLocalLoad(){try{const v=JSON.parse(store.get("goals")||"[]");return Array.isArray(v)?v.map(d=>goalClean(String(d.id),d)).filter(g=>g.t&&g.d):[]}catch(e){return []}}
function goalsLocalSave(){store.set("goals",JSON.stringify(goals))}
// remind = days before the due date to start reminding (-1 = never); snooze = the day a reminder was hidden
const REM_OPTS = [[-1,"rOff"],[0,"rDay"],[1,"r1"],[2,"r2"],[7,"r7"]];
function hwClean(id, d){
  const r=Number(d.remind);
  return {id, name:String(d.name||""), due:ISO.test(d.due)?d.due:"", done:d.done===true, created:Number(d.created)||0,
    remind:REM_OPTS.some(o=>o[0]===r)&&d.remind!==undefined&&d.remind!==null?r:1, snooze:ISO.test(d.snooze)?d.snooze:"",
    // steps = the study plan ({t: text, d: day, done}); mins = minutes spent with the focus timer
    steps:Array.isArray(d.steps)?d.steps.slice(0,8).map(s=>({t:String((s&&s.t)||"").slice(0,140), d:ISO.test(s&&s.d)?s.d:"", done:!!(s&&s.done)})).filter(s=>s.t):[],
    mins:Math.max(0,Math.round(Number(d.mins)||0))};
}
function isoOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function todayISO(){return isoOf(new Date())}
function toDate(iso){const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d)}
function dayDiff(iso){const now=new Date();now.setHours(0,0,0,0);return Math.round((toDate(iso)-now)/86400000)}
function hwNote(msg, warn){const n=$("hwNote");n.textContent=msg||"";n.classList.toggle("warn",!!warn)}
function hwFail(){hwNote(t("hwError"),true);renderHw()}

function renderHw(){
  const list=$("hwList"); list.innerHTML="";
  let rtf=null, dtf=null;
  try{rtf=new Intl.RelativeTimeFormat(ui,{numeric:"auto"});dtf=new Intl.DateTimeFormat(ui,{weekday:"short",day:"numeric",month:"short"})}catch(e){}
  const key=it=>it.due||"9999-99-99", reps=hwRepeats();
  hw.slice().sort((a,b)=>(a.done-b.done)||(key(a)<key(b)?-1:key(a)>key(b)?1:0)||(a.created-b.created)).forEach(it=>{
    const li=document.createElement("li"); li.className="hw-item"+(it.done?" done":""); li.dataset.id=it.id;
    const cb=document.createElement("input"); cb.type="checkbox"; cb.className="hw-chk"; cb.id="hw-"+it.id; cb.checked=it.done;
    cb.addEventListener("change",()=>hwToggle(it,cb.checked));
    const name=document.createElement("label"); name.className="hw-name"; name.htmlFor=cb.id; name.dir="auto"; name.textContent=it.name;
    const due=document.createElement("div"); due.className="due";
    if(it.due){
      const n=dayDiff(it.due);
      const time=document.createElement("time"); time.dateTime=it.due; time.textContent=dtf?dtf.format(toDate(it.due)):it.due;
      const pill=document.createElement("span"); pill.className="pill"+(n<0?" over":n<=1?" soon":""); pill.textContent=rtf?rtf.format(n,"day"):String(n);
      const sel=document.createElement("select"); sel.className="remind-sel"; sel.setAttribute("aria-label",t("remind")+": "+it.name);
      REM_OPTS.forEach(([v,k])=>{const o=document.createElement("option");o.value=String(v);o.textContent=t(k);sel.append(o)});
      sel.value=String(it.remind);
      sel.addEventListener("change",()=>hwUpdate(it,{remind:Number(sel.value),snooze:""}));
      due.append(time,pill,sel);
    } else due.textContent=t("noDate");
    if(reps.has(it)){const r=document.createElement("span"); r.className="rep-tag"; r.textContent=t("hwRepeat"); due.append(r)}
    const help=document.createElement("button"); help.type="button"; help.className="tool hw-help"; help.textContent=t("hwHelp");
    help.addEventListener("click",()=>{
      $("question").value=it.name; store.set("draft",it.name);
      $("question").scrollIntoView({behavior:"smooth",block:"center"}); $("question").focus({preventScroll:true});
    });
    const del=document.createElement("button"); del.type="button"; del.className="icon-btn"; del.setAttribute("aria-label",t("hwDel")+": "+it.name); del.title=t("hwDel");
    del.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    del.addEventListener("click",()=>hwDelete(it));
    if(it.mins){const m=document.createElement("span"); m.className="mins"; m.textContent=it.mins+" "+t("minLbl"); due.append(m)}
    const acts=document.createElement("div"); acts.className="hw-acts";
    if(!it.done){
      const plan=document.createElement("button"); plan.type="button"; plan.className="tool";
      plan.textContent = it.steps.length ? t("clearPlan") : t("planIt");
      plan.addEventListener("click",()=> it.steps.length ? hwUpdate(it,{steps:[]}) : planIt(it,plan));
      acts.append(plan);
    }
    acts.append(help);
    li.append(cb,name,due,acts,del);
    if(it.steps.length && !it.done){
      li.classList.add("has-steps");
      const ul=document.createElement("ul"); ul.className="hw-steps";
      it.steps.forEach((s,idx)=>{
        const row=document.createElement("li"); if(s.done) row.className="done";
        const sc=document.createElement("input"); sc.type="checkbox"; sc.id="st-"+it.id+"-"+idx; sc.checked=s.done;
        sc.addEventListener("change",()=>toggleStep(it,idx,sc.checked));
        const lab=document.createElement("label"); lab.htmlFor=sc.id; lab.dir="auto"; lab.textContent=s.t;
        row.append(sc,lab);
        if(s.d){const tm=document.createElement("time"); tm.dateTime=s.d; tm.textContent=dtf?dtf.format(toDate(s.d)):s.d; row.append(tm)}
        ul.append(row);
      });
      li.append(ul);
    }
    list.append(li);
  });
  $("hwEmpty").hidden = hw.length>0;
  const done=hw.filter(x=>x.done).length;
  $("hwCount").textContent = hw.length ? done+" / "+hw.length+" ✓" : "";
  $("hwDedupe").hidden = !reps.size; $("hwDedupe").textContent = t("eraseRepeats")+" ("+reps.size+")";
  if(hwMode==="local" && !$("hwNote").classList.contains("warn")) hwNote(t("localNote"));
  renderReminders();
  renderSchedule();
  refreshTimerTasks();
}

function toggleStep(it, idx, done){hwUpdate(it,{steps:it.steps.map((s,i)=>i===idx?{...s,done}:s)})}

// Ask Claude to split an assignment into dated steps between today and the deadline.
async function planIt(it, btn){
  if(!it.due){hwNote(t("planNeedsDate"),true);return}
  const sample=await samplePromise;
  if(!sample){hwNote(t("unavailable"),true);return}
  const today=todayISO(), last=it.due<today?today:it.due;
  const english=langInfo($("answerLang").value)[2];
  btn.disabled=true; btn.textContent=t("thinking"); hwNote("");
  try{
    const v=await sample.json([
      'A '+LEVEL_EN[$("level").value]+' student has this assignment: "'+it.name+'".',
      "Today is "+today+" and it is due on "+it.due+".",
      "Break it into 2 to 6 concrete study steps and spread them over the days from "+today+" to "+last+".",
      "Keep the last step (check and hand in) for "+last+". If the due date has passed, put every step on "+today+".",
      "Write each step in "+english+", under 12 words, starting with a verb.",
      'Reply with only a JSON array like [{"step":"Read chapter 3 and take notes","date":"'+today+'"}].'
    ].join("\n"),{modelTier:"quick",cache:false});
    const steps=(Array.isArray(v)?v:[]).map(s=>{
      let d=ISO.test(s&&s.date)?s.date:last; if(d<today) d=today; if(d>last) d=last;
      return {t:String((s&&s.step)||"").trim().slice(0,140), d, done:false};
    }).filter(s=>s.t).slice(0,8).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
    if(!steps.length) throw {code:"invalid_json"};
    hwUpdate(it,{steps});
  }catch(e){hwNote(msgFor(e&&e.code),true)}
}

function renderSchedule(){
  const today=todayISO();
  let f=null;
  try{f={
    wd:new Intl.DateTimeFormat(ui,{weekday:"short"}), d:new Intl.DateTimeFormat(ui,{day:"numeric"}),
    m:new Intl.DateTimeFormat(ui,{month:"short"}), head:new Intl.DateTimeFormat(ui,{weekday:"long",day:"numeric",month:"long"}),
    short:new Intl.DateTimeFormat(ui,{day:"numeric",month:"short"}), rtf:new Intl.RelativeTimeFormat(ui,{numeric:"auto"})
  }}catch(e){}
  const el=(tag,cls,text)=>{const x=document.createElement(tag); if(cls) x.className=cls; if(text!=null) x.textContent=text; return x};
  // Everything with a date: assignments on their due day, study-plan steps on their own day
  const dated=[];
  hw.forEach(it=>{
    if(it.due) dated.push({it, due:it.due, done:it.done, created:it.created});
    if(!it.done) it.steps.forEach((s,idx)=>{if(s.d) dated.push({it, step:s, idx, due:s.d, done:s.done, created:it.created+idx+1})});
  });
  goals.forEach(g=>dated.push({goal:g, due:g.d, done:g.done, created:g.created}));
  const byDue=(a,b)=>(a.due<b.due?-1:a.due>b.due?1:0)||(a.created-b.created);
  // One line of the schedule: an assignment, a study-plan step or a goal, with its tickbox
  const row=(en, showWhen)=>{
    const li=el("li",(en.done?"done":"")+(en.step?" step":""));
    const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=en.done;
    cb.id=(showWhen===2?"dp-":"sc-")+(en.goal?en.goal.id:en.it.id+(en.step?"-"+en.idx:""));
    cb.addEventListener("change",()=>en.goal?goalUpdate(en.goal,{done:cb.checked}):en.step?toggleStep(en.it,en.idx,cb.checked):hwToggle(en.it,cb.checked));
    const lab=el("label","",en.goal?en.goal.t:en.step?en.step.t:en.it.name); lab.htmlFor=cb.id; lab.dir="auto";
    if(en.step){const of=el("span","of",en.it.name); of.dir="auto"; lab.append(" ",of)}
    li.append(cb);
    if(en.goal) li.append(el("span","goal-tag",t("goalTag")));
    li.append(lab);
    if(showWhen===1) li.append(el("span","when",f?f.short.format(toDate(en.due)):en.due));
    if(en.goal && showWhen===2){
      const del=el("button","icon-btn"); del.type="button"; del.title=t("goalDel"); del.setAttribute("aria-label",t("goalDel")+": "+en.goal.t);
      del.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
      del.addEventListener("click",()=>goalDelete(en.goal));
      li.append(del);
    }
    return li;
  };

  // Next 7 days: how much is still to do on each day; tap a day to open it below
  const week=$("week"), hadFocus=week.contains(document.activeElement);
  week.innerHTML=""; week.setAttribute("aria-label",t("next7"));
  for(let i=0;i<7;i++){
    const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+i);
    const iso=isoOf(d), n=dated.filter(it=>it.due===iso && !it.done).length;
    const cell=el("button","wd"+(i===0?" today":"")+(n?" has":"")+(iso===selDay?" sel":"")); cell.type="button";
    cell.setAttribute("aria-pressed",String(iso===selDay));
    const name=f?f.wd.format(d):iso.slice(5), num=f?f.d.format(d):String(d.getDate());
    cell.setAttribute("aria-label",(f?f.head.format(d):iso)+": "+n);
    cell.append(el("span","wd-name",name), el("span","wd-num",num), el("span","wd-count",n?String(n):"·"));
    cell.addEventListener("click",()=>{selDay=iso; renderSchedule()});
    week.append(cell);
    if(hadFocus && iso===selDay) cell.focus();
  }

  // The chosen day: what is due, and the goals set for it
  const sd=toDate(selDay);
  $("dpTitle").textContent=f?f.head.format(sd):selDay;
  $("dayPick").value=selDay;
  const onDay=dated.filter(en=>en.due===selDay).sort(byDue);
  const dueUl=$("dpDue"); dueUl.innerHTML="";
  onDay.filter(en=>!en.goal).forEach(en=>dueUl.append(row(en,2)));
  $("dpDueLbl").hidden=!dueUl.children.length;
  const goalUl=$("dpGoals"); goalUl.innerHTML="";
  onDay.filter(en=>en.goal).forEach(en=>goalUl.append(row(en,2)));
  $("dpNoGoals").hidden=goalUl.children.length>0;

  // Day by day: overdue work first, then every date that has something due
  const agenda=$("agenda"); agenda.innerHTML="";
  const groups=[];
  const over=dated.filter(it=>!it.done && !it.goal && it.due<today).sort(byDue);
  if(over.length) groups.push([null,over]);
  dated.filter(it=>it.due>=today).sort(byDue).forEach(it=>{
    const last=groups[groups.length-1];
    if(last && last[0]===it.due) last[1].push(it); else groups.push([it.due,[it]]);
  });
  groups.forEach(([iso,items])=>{
    const date=iso?toDate(iso):null;
    const li=el("li","day"+(iso?"":" over"));
    const cal=el("div","cal"+(iso?"":" over")); cal.setAttribute("aria-hidden","true");
    cal.append(
      el("div","cal-m",iso?(f?f.m.format(date):iso.slice(5,7)):" "),
      el("div","cal-d",iso?(f?f.d.format(date):iso.slice(8)):"!"),
      el("div","cal-w",iso&&f?f.wd.format(date):" "));
    const body=el("div","day-body"), head=el("div","day-head");
    head.append(el("span","",iso?(f?f.head.format(date):iso):t("overdueLbl")));
    if(iso && f){const n=dayDiff(iso); head.append(el("span","pill"+(n<=1?" soon":""),f.rtf.format(n,"day")))}
    const ul=el("ul","day-items");
    items.forEach(en=>ul.append(row(en,iso?0:1)));
    body.append(head,ul); li.append(cal,body); agenda.append(li);
  });
  $("schedEmpty").hidden = groups.length>0;
}

function renderReminders(){
  const today=todayISO(), list=$("remList"); list.innerHTML="";
  let rtf=null; try{rtf=new Intl.RelativeTimeFormat(ui,{numeric:"auto"})}catch(e){}
  const due=hw.filter(it=>!it.done && it.due && it.remind>=0 && dayDiff(it.due)<=it.remind && it.snooze!==today)
    .sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0);
  due.forEach(it=>{
    const n=dayDiff(it.due);
    const li=document.createElement("li"); li.className="rem-item";
    const name=document.createElement("span"); name.className="rem-name"; name.dir="auto"; name.textContent=it.name;
    const pill=document.createElement("span"); pill.className="pill"+(n<0?" over":""); pill.textContent=rtf?rtf.format(n,"day"):it.due;
    const actions=document.createElement("div"); actions.className="rem-actions";
    const done=document.createElement("button"); done.type="button"; done.className="tool"; done.textContent=t("markDone");
    done.addEventListener("click",()=>hwUpdate(it,{done:true}));
    const hide=document.createElement("button"); hide.type="button"; hide.className="tool"; hide.textContent=t("dismiss");
    hide.addEventListener("click",()=>hwUpdate(it,{snooze:today}));
    actions.append(done,hide); li.append(name,pill,actions); list.append(li);
  });
  $("reminders").hidden = due.length===0;
}

function hwUpdate(it, patch){
  hwNote("");
  if(hwCol){hwCol.doc(it.id).update(patch).catch(hwFail);return}
  Object.assign(it,patch); hwLocalSave(); renderHw();
}
function hwToggle(it, done){hwUpdate(it,{done})}

let hwDay=todayISO();
setInterval(()=>{const d=todayISO(); if(d!==hwDay){if(selDay===hwDay) selDay=d; hwDay=d; renderHw()}},60000);

function goalUpdate(g, patch){
  hwNote("");
  if(hwCol){hwCol.doc(g.id).update(patch).catch(hwFail);return}

}
function goalDelete(g){
