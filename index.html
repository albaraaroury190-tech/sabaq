  if(hwCol){hwCol.doc(g.id).delete().catch(hwFail);return}
  goals=goals.filter(x=>x!==g); goalsLocalSave(); renderSchedule();
}
$("goalForm").addEventListener("submit",e=>{

  $("goalText").value=""; $("goalText").focus();
});
$("dayPick").addEventListener("change",()=>{const v=$("dayPick").value; if(ISO.test(v)){selDay=v; renderSchedule()}});
$("dpAddHw").addEventListener("click",()=>{
  $("hwDue").value=selDay;
  $("hwName").scrollIntoView({behavior:"smooth",block:"center"}); $("hwName").focus({preventScroll:true});
});
// Homework counts as repeated when its name (ignoring case, spacing, punctuation and Arabic vowel marks) and due date match.
function hwKey(it){return String(it.name).normalize("NFKC").toLowerCase().replace(/[ً-ٰٟـ]/g,"").replace(/[\s\p{P}]+/gu," ").trim()+"|"+it.due}
// The copies to erase: in each group keep the one with the most progress (ticked, planned, timed), else the oldest.
function hwRepeats(){
  const keep=new Map(), score=x=>(x.done?4:0)+(x.steps.length?2:0)+(x.mins?1:0);
  hw.forEach(x=>{const k=hwKey(x), b=keep.get(k); if(!b||score(x)>score(b)||(score(x)===score(b)&&x.created<b.created)) keep.set(k,x)});
  const kept=new Set(keep.values());
  return new Set(hw.filter(x=>!kept.has(x)));
}
function hwEraseRepeats(){
  const reps=hwRepeats(); if(!reps.size) return;
  if(hwCol) reps.forEach(it=>hwCol.doc(it.id).delete().catch(hwFail));
  else {hw=hw.filter(x=>!reps.has(x)); hwLocalSave(); renderHw()}
  hwNote(t("hwErased"));
}
$("hwDedupe").addEventListener("click",hwEraseRepeats);
function hwFlash(it){
  const li=[...$("hwList").children].find(x=>x.dataset.id===it.id); if(!li) return;
  li.classList.remove("flash"); void li.offsetWidth; li.classList.add("flash");
  li.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function hwDelete(it){
  hwNote("");
  if(hwCol){hwCol.doc(it.id).delete().catch(hwFail);return}
  hw=hw.filter(x=>x!==it); hwLocalSave(); renderHw();
}
$("hwForm").addEventListener("submit",e=>{
  e.preventDefault();
  const name=$("hwName").value.trim();
  if(!name){$("hwName").focus();return}
  const item={name, due:ISO.test($("hwDue").value)?$("hwDue").value:"", done:false, created:Date.now(), remind:Number($("hwRemind").value), snooze:""};
  const same=hw.find(x=>hwKey(x)===hwKey(item));
  if(same){hwNote(t("hwAlready"),true); hwFlash(same); $("hwName").select(); return}
  hwNote("");
  if(hwCol) hwCol.add(item).catch(hwFail);
  else {hw.push(hwClean("l"+item.created.toString(36)+Math.random().toString(36).slice(2,6),item)); hwLocalSave(); renderHw()}
  $("hwName").value=""; $("hwDue").value=""; $("hwName").focus();
});

function hwGoLocal(){hwCol=null; hwMode="local"; hw=hwLocalLoad().map(d=>hwClean(String(d.id),d)); goals=goalsLocalLoad(); renderHw()}
hw = hwLocalLoad().map(d=>hwClean(String(d.id),d));
goals = goalsLocalLoad();
(async()=>{
  if(!(window.claude && claude.use)){hwGoLocal();return}
  const [db,user]=await Promise.all([claude.use("db").catch(()=>null),claude.use("user").catch(()=>null)]);
  const id = user ? await user.id().catch(()=>null) : null;
  if(!db || !id){hwGoLocal();return}
  const col=db.collection("data/users/"+id);
  let first=true;
  const timer=setTimeout(()=>{if(first) hwGoLocal()},10000);
  col.onSnapshot(snap=>{
    clearTimeout(timer);
    if(first){
      first=false; hwCol=col; hwMode="db"; hwNote("");
      const local=hwLocalLoad(), localGoals=goalsLocalLoad();
      if(snap.empty && (local.length || localGoals.length)){
        // Move a list made on this device before signing in into the account.
        local.forEach(d=>{const c=hwClean("",d); delete c.id; col.add(c).catch(()=>{})});
        localGoals.forEach(g=>{const c={kind:"goal",...g}; delete c.id; col.add(c).catch(()=>{})});
        store.set("homework","[]"); store.set("goals","[]");
      }
    }
    if(hwCol!==col) return;
    const docs=snap.docs.map(d=>[d.id,d.data()||{}]);
    hw=docs.filter(([,v])=>v.kind!=="goal").map(([id,v])=>hwClean(id,v));
    goals=docs.filter(([,v])=>v.kind==="goal").map(([id,v])=>goalClean(id,v)).filter(g=>g.t&&g.d);
    renderHw();
  },()=>{clearTimeout(timer); hwGoLocal()});
})();
