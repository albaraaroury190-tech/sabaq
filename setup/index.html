<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set up Sabaq</title>
<meta name="description" content="Install Sabaq Study Desk on your phone, tablet or computer.">
<meta name="theme-color" content="#050C19">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Sabaq">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Nastaliq+Urdu:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Young+Serif&display=swap">
<style>
:root{
  --desk:#E8ECF3; --sheet:#FFFFFF; --paper:#FCFDFF; --ink:#18202E; --muted:#596377;
  --rule:#D3DAE6; --pen:#2546C4; --pen-soft:#E3E8FB; --on-pen:#FFFFFF; --ok:#1D7A4B; --ok-soft:#E1F3E9;
  --font-display:"Young Serif","Noto Naskh Arabic","Noto Sans Devanagari","Noto Sans Bengali",Georgia,serif;
  --font-body:"Atkinson Hyperlegible","Noto Naskh Arabic","Noto Sans Devanagari","Noto Sans Bengali","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#0F131B; --sheet:#171C27; --paper:#1A202D; --ink:#E5E9F1; --muted:#9BA4B6;
    --rule:#2B3344; --pen:#93A8FF; --pen-soft:#25304D; --on-pen:#0D1430; --ok:#71D59F; --ok-soft:#173627; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#0F131B; --sheet:#171C27; --paper:#1A202D; --ink:#E5E9F1; --muted:#9BA4B6;
  --rule:#2B3344; --pen:#93A8FF; --pen-soft:#25304D; --on-pen:#0D1430; --ok:#71D59F; --ok-soft:#173627; color-scheme:dark;
}
[lang="ur"]{--font-body:"Noto Nastaliq Urdu","Noto Naskh Arabic",system-ui,sans-serif;--font-display:var(--font-body);line-height:2.15}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font-body);line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--pen)}
.wrap{max-width:880px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left));display:grid;gap:18px}
.langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.langs button{font:inherit;font-size:.9rem;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:999px;padding:3px 11px;cursor:pointer}
.langs button[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft)}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:clamp(18px,4vw,32px)}
.hero{display:grid;justify-items:center;text-align:center;gap:14px}
.hero img{width:120px;height:120px;border-radius:22%;box-shadow:0 4px 18px rgb(0 0 0 / .22)}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.15;margin:0}
.lead{margin:0;max-width:52ch;color:var(--muted);font-size:1.05rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.primary{font:inherit;font-weight:700;font-size:1.05rem;background:var(--pen);color:var(--on-pen);border:0;border-radius:12px;padding:14px 28px;cursor:pointer;text-decoration:none;display:inline-block}
.primary:hover{filter:brightness(1.08)}
.done{margin:0;padding:10px 16px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:700}
h2{font-size:.85rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
[lang="ar"] h2,[lang="ur"] h2{letter-spacing:0;font-size:.95rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.step{border:1px solid var(--rule);border-radius:12px;padding:16px;background:var(--paper);display:grid;gap:8px;align-content:start}
.step.mine{border-color:var(--pen);box-shadow:inset 0 0 0 1px var(--pen)}
.step h3{margin:0;font-size:1.05rem;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tag{font-size:.75rem;font-weight:700;background:var(--pen);color:var(--on-pen);border-radius:999px;padding:1px 9px}
.step ol{margin:0;padding-inline-start:1.3em;display:grid;gap:6px}
.qr{display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.qr-code{width:150px;height:150px;flex:none;background:#fff;border-radius:10px;padding:8px;line-height:0}
.qr-code svg{width:100%;height:100%}
.qr p{margin:0;flex:1 1 220px}
.qr .link{display:block;margin-top:6px;font-size:.9rem;overflow-wrap:anywhere;direction:ltr;unicode-bidi:isolate}
.note{margin:0;color:var(--muted);font-size:.92rem;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <nav class="langs" id="langs" aria-label="Language"></nav>

  <section class="card hero">
    <img src="../icons/icon-192.png" width="192" height="192" alt="Sabaq logo">
    <h1 data-t="title"></h1>
    <p class="lead" data-t="lead"></p>
    <div class="actions">
      <button type="button" class="primary" id="installBtn" data-t="install" hidden></button>
      <a class="primary" id="openBtn" href="../" data-t="open" hidden></a>
      <a id="browserLink" href="../" data-t="openBrowser"></a>
    </div>
    <p class="done" id="doneMsg" role="status" hidden></p>
  </section>

  <section class="card" aria-labelledby="stepsTitle">
    <h2 id="stepsTitle" data-t="steps"></h2>
    <div class="steps" id="steps">
      <div class="step" data-os="ios">
        <h3><span data-t="ios"></span></h3>
        <ol><li data-t="ios1"></li><li data-t="ios2"></li><li data-t="ios3"></li></ol>
      </div>
      <div class="step" data-os="android">
        <h3><span data-t="and"></span></h3>
        <ol><li data-t="and1"></li><li data-t="and2"></li></ol>
      </div>
      <div class="step" data-os="desktop">
        <h3><span data-t="desk"></span></h3>
        <ol><li data-t="desk1"></li><li data-t="desk2"></li></ol>
      </div>
    </div>
  </section>

  <section class="card qr">

  zh:{name:"中文",title:"安装 Sabaq",lead:"把 Sabaq 装到你的手机、平板或电脑上。它像应用一样打开，没有网络也能用，作业保存在你的设备上。",install:"安装 Sabaq",installed:"完成！Sabaq 已在你的主屏幕或应用列表中。",already:"这台设备上已经安装了 Sabaq。",open:"打开 Sabaq",openBrowser:"或者在浏览器中使用",steps:"安装方法",ios:"iPhone 和 iPad",ios1:"在 Safari 中打开此页面。",ios2:"点按“分享”按钮（带箭头的方框）。",ios3:"点按“添加到主屏幕”，然后点“添加”。",and:"安卓",and1:"在 Chrome 中打开此页面。",and2:"点按上方的“安装 Sabaq”，或打开 ⋮ 菜单，选择“安装应用”或“添加到主屏幕”。",desk:"电脑（Chrome 或 Edge）",desk1:"点击上方的“安装 Sabaq”，或地址栏右端的安装图标。",desk2:"之后 Sabaq 会在独立窗口中打开，和你的其他应用放在一起。",qr:"在用电脑？用手机相机扫描此码，把 Sabaq 装到手机上。",note:"这里所有功能都能用：作业、日程、目标、专注计时，以及 Sabaq 免费 AI 助手提供的解答、抽认卡、测验和学习计划。",mine:"你的设备"}
};
const RTL = new Set(["ar","ur"]);
const store = {
  get(k){try{return localStorage.getItem("sabaq."+k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem("sabaq."+k,v)}catch(e){}}
};
const $ = id => document.getElementById(id);
// The same language the app uses on this device, else the browser's
let lang = store.get("ui");
if(!T[lang]) lang = (navigator.languages||[navigator.language||"en"]).map(l=>String(l).slice(0,2).toLowerCase()).find(l=>T[l]) || "en";

const ua = navigator.userAgent;
const os = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? "ios" : /Android/.test(ua) ? "android" : "desktop";
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
let deferred = null, state = standalone() ? "already" : "";

function render(){
  const s = T[lang], root = document.documentElement;
  root.lang = lang; root.dir = RTL.has(lang) ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = s[el.dataset.t] });
  document.title = s.title;
  document.querySelectorAll("#langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
  // Put the steps for this device first and mark them
  document.querySelectorAll(".step").forEach(step => {
    const mine = step.dataset.os === os;
    step.classList.toggle("mine", mine);
    step.querySelector(".tag")?.remove();
    if(mine){ const t = document.createElement("span"); t.className = "tag"; t.textContent = s.mine; step.querySelector("h3").append(t); step.parentNode.prepend(step) }
  });
  $("installBtn").hidden = !deferred || !!state;
  $("openBtn").hidden = !state;
  $("browserLink").hidden = !!state;
  $("doneMsg").hidden = !state;
  $("doneMsg").textContent = state ? s[state] : "";
}

Object.keys(T).forEach(code => {
  const b = document.createElement("button"); b.type = "button"; b.dataset.l = code; b.lang = code; b.textContent = T[code].name;
  b.addEventListener("click", () => { lang = code; store.set("ui", code); render() });
  $("langs").append(b);
});

addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; render() });
addEventListener("appinstalled", () => { deferred = null; state = "installed"; render() });
$("installBtn").addEventListener("click", async () => {
  if(!deferred) return;
  deferred.prompt();
  const choice = await deferred.userChoice.catch(() => null);
  deferred = null;
  if(choice && choice.outcome === "accepted") state = "installed";
  render();
});

if("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js").catch(() => {});
render();
</script>
